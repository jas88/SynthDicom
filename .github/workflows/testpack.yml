name: Build, test and package

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "22 19 * * 4"

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Disable disk flush
        run: sudo apt-get install -y libeatmydata1
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # MinVer derives the package version from git tags, so it needs full history
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          # .NET 10 runtime for the net10.0 test run and BadDicom
          dotnet-version: 10.0.x
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: +security-and-quality
      - name: Start MySQL for testing
        run: sudo systemctl start mysql.service
      - name: Build and Test
        run: |
          dotnet build -c Release --nologo
          dotnet test "./SynthDicom.Tests/SynthDicom.Tests.csproj" --nologo -c Release --no-build --collect:"XPlat Code Coverage"
          curl -sL https://raw.githubusercontent.com/SMI/DicomTypeTranslation/master/Templates/CT.it > ./CT.it
          cp BadDicom/BadDicom.template.yaml BadDicom.yaml
          dotnet run --project BadDicom/BadDicom.csproj -- ./ 50000 10 CT
          sed -i "s/Batches: 1/Batches: 5/g" ./BadDicom.yaml
          sed -i "s/DropTables: false/DropTables: true/g" ./BadDicom.yaml
          dotnet run --project BadDicom/BadDicom.csproj -- ./ 50000 10 CT
      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
          upload: False
          output: sarif-results
      - name: Filter SARIF
        uses: advanced-security/filter-sarif@v1
        with:
          patterns: |
            +**/*
            -**/*.g.cs
          input: sarif-results/csharp.sarif
          output: sarif-results/csharp.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results/csharp.sarif
      - name: Package
        run: |
          mkdir -p dist
          dotnet pack ./SynthDicom/SynthDicom.csproj -c Release -o dist -p:DebugType=full -p:SymbolPackageFormat=snupkg -p:IncludeSymbols=true -nologo
          for platform in linux-x64 win-x64 osx-{arm64,x64}
          do
            dotnet publish BadDicom/BadDicom.csproj -c Release -r $platform -o $platform --self-contained true -nologo -v q -p:PublishSingleFile=true -p:DebugType=embedded -p:GenerateDocumentationFile=false
          done
          zip -9r dist/baddicom-win-x64-v$(grep AssemblyInformationalVersion SharedAssemblyInfo.cs | cut -d'"' -f2).zip ./win-x64
          for platform in linux-x64 win-x64 osx-{arm64,x64}
          do
            tar cJf dist/baddicom-${platform}-v$(grep AssemblyInformationalVersion SharedAssemblyInfo.cs | cut -d'"' -f2).tar.xz ./$platform
          done
          ls -lh dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SynthDicom-dist
          path: dist/

  # Tag-only jobs, so PR/branch builds never hold id-token or contents write
  # permissions. NuGet publishing (OIDC) and the GitHub release upload run in
  # separate jobs so third-party release actions never see an id-token.
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write  # NuGet Trusted Publishing (OIDC)
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: SynthDicom-dist
          path: dist
      - name: Check tag matches package and binary versions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for f in "dist/SynthDicom.$VERSION.nupkg" "dist/baddicom-linux-x64-v$VERSION.tar.xz"; do
            if [ ! -f "$f" ]; then
              echo "::error::Tag $GITHUB_REF_NAME expects $f (check SharedAssemblyInfo.cs) but found: $(ls -- dist)"
              exit 1
            fi
          done
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: jas88
      - name: Publish to NuGet
        run: dotnet nuget push "dist/SynthDicom.${GITHUB_REF_NAME#v}.nupkg" --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # upload release binaries
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: SynthDicom-dist
          path: dist
      - name: Upload release binaries
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/baddicom*
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
